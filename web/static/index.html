<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liveness Verifier — Demo</title>
<link rel="stylesheet" href="/demo/style.css">
</head>
<body>
<main>
  <header>
    <h1>Verifikasi Liveness</h1>
    <p class="sub">Demo lokal. Butuh izin kamera, dan hanya bekerja lewat <code>localhost</code>.</p>
  </header>

  <section class="stage">
    <div class="viewport">
      <!-- Mirrored, the way people expect a selfie preview to look. The
           instruction text compensates for it; see app.js. -->
      <video id="preview" autoplay playsinline muted></video>
      <canvas id="capture" hidden></canvas>

      <!-- The countdown sits over the video because that is where the subject
           is already looking. A timer in a side panel is a timer nobody sees. -->
      <div id="timer" class="timer" hidden>
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="track" cx="22" cy="22" r="19"></circle>
          <circle id="timerArc" class="arc" cx="22" cy="22" r="19"></circle>
        </svg>
        <span id="timerText">10</span>
      </div>

      <div id="badge" class="badge" hidden></div>

      <!-- Shown over the video for a beat when a step is satisfied.
           aria-live so it is announced rather than only seen: the subject is
           looking at the camera, not reading the panel. -->
      <div id="pass" class="pass" hidden role="status" aria-live="polite">
        <div class="pass-mark" aria-hidden="true">✓</div>
        <p id="passTitle" class="pass-title"></p>
        <p id="passNext" class="pass-next"></p>
      </div>
    </div>

    <div class="panel">
      <p id="instruction" class="instruction">Tekan mulai untuk memulai sesi.</p>
      <p id="hint" class="hint"></p>

      <ol id="steps" class="steps"></ol>

      <div class="controls">
        <button id="start" type="button">Mulai verifikasi</button>
        <button id="stop" type="button" hidden>Batalkan</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <footer>
    <p>
      Bukan sistem tersertifikasi PAD. Ambang belum dikalibrasi.
      Mode <code id="mode">?</code>.
    </p>
  </footer>
</main>

<script src="/demo/app.js"></script>
</body>
</html>
